[project]
name = "mcp-login-oauth"
version = "0.2.2"
description = "OAuth 2.1 browser login for FastMCP servers whose login is a form checked by the service behind them"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Marcel Bruckner" }]
requires-python = ">=3.12"
dependencies = ["fastmcp>=4.1.3"]
keywords = ["mcp", "fastmcp", "oauth", "oauth2", "login", "authorization-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://marceltov.github.io/mcp-login-oauth/"
Source = "https://github.com/Marceltov/mcp-login-oauth"
Issues = "https://github.com/Marceltov/mcp-login-oauth/issues"
Changelog = "https://github.com/Marceltov/mcp-login-oauth/releases"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_login_oauth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
