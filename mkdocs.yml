site_name: mcp-login-oauth
site_description: The OAuth server for MCP clients of FastMCP servers whose login is a form checked by the service behind them.
site_url: https://mcp-login-oauth.marceltov.de/
repo_url: https://github.com/Marceltov/mcp-login-oauth
repo_name: Marceltov/mcp-login-oauth
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Marcel Bruckner. Licensed under <a href="https://github.com/Marceltov/mcp-login-oauth/blob/main/LICENSE">AGPL-3.0-or-later</a>

hooks:
  - docs_hooks/roadmap.py

nav:
  - Home: index.md
  - What mcp-login-oauth stands for: values.md
  - Start:
      - Install and first server: getting-started.md
  - Guides:
      - Coming from TypeScript: typescript.md
  - Reference:
      - Python API: reference.md
      - Lifetimes, flow and limits: behaviour.md
  - Contributing:
      - Development and releases: development.md
      - Roadmap: roadmap.md
  - Decisions:
      - One library for all FastMCP servers: adr/0001-shared-login-oauth-library.md
      - check_login learns the client: adr/0002-check-login-learns-the-client.md

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
