site_name: mcp-login-oauth
site_description: The OAuth server for MCP clients of servers whose login is a form checked by a service, or a sign-in at one OpenID Connect provider. Python and TypeScript.
site_url: https://marceltov.github.io/mcp-login-oauth/
repo_url: https://github.com/Marceltov/mcp-login-oauth
repo_name: Marceltov/mcp-login-oauth
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Marcel Bruckner. Licensed under <a href="https://github.com/Marceltov/mcp-login-oauth/blob/main/LICENSE">AGPL-3.0-or-later</a>

hooks:
  - docs_hooks/roadmap.py

nav:
  - Home: index.md
  - What mcp-login-oauth stands for: values.md
  - Where mcp-login-oauth is going: roadmap.md
  - Getting started:
      - Python: getting-started/python.md
      - TypeScript: getting-started/typescript.md
  - Reference:
      - Behaviour: reference/behaviour.md
      - Python: reference/python.md
      - TypeScript: reference/typescript.md
  - Development: development.md
  - Design decisions:
      - One library for all FastMCP servers: adr/0001-shared-login-oauth-library.md
      - check_login learns the client: adr/0002-check-login-learns-the-client.md
      - The TypeScript package: adr/0003-typescript-package.md
      - Apps with a web UI use Better Auth: adr/0004-web-apps-sign-in-with-better-auth.md

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
