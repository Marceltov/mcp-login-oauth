# The roadmap, as data. docs_hooks/roadmap.py (from passageway) renders it as the timeline on the roadmap page.
#
# Open entries (status next, later or decide) are shown first, in the order of this file, each with a `when` label and `details`.
# Done entries are shown below them, newest date first (the order of this file breaks ties), each with a `date` and a link to its
# pull request or release.
#
# To finish a step: set `status: done`, replace `when` with `date: YYYY-MM-DD`, add the link to its pull request, and move it to the
# top of the done entries. `icon` is the name of a Material Design icon (https://pictogrammers.com/library/mdi/).
# `details` is a small subset of markdown: paragraphs, "- " lists, **bold**, `code` and [links](https://...).

items:
  # ---- open ------------------------------------------------------------------------------------------------------------
  - id: typescript-release
    status: next
    when: Now
    icon: package-variant-closed
    title: First TypeScript release
    summary: Tag `ts-v0.1.0`, so that TypeScript servers install the package from its release tarball.
    links:
      - {label: "#5", url: "https://github.com/Marceltov/mcp-login-oauth/issues/5"}
      - {label: "V3", url: "https://marceltov.github.io/mcp-login-oauth/values/#v3-the-same-in-python-and-typescript"}
    details: |
      The release workflow is on `main`; the tag has to be pushed from a machine that may push tags:
      - `git tag -a ts-v0.1.0 origin/main -m "TypeScript v0.1.0"`
      - `git push origin ts-v0.1.0`

  - id: client-id-metadata
    status: next
    when: Next
    icon: card-account-details-outline
    title: Client ID Metadata Documents
    summary: Accept clients that identify themselves by a metadata URL, which the MCP spec now prefers over dynamic registration, in both packages.
    links:
      - {label: "#6", url: "https://github.com/Marceltov/mcp-login-oauth/issues/6"}
      - {label: "V4", url: "https://marceltov.github.io/mcp-login-oauth/values/#v4-standards-any-client-speaks"}
    details: |
      Fetch and validate the document (HTTPS only, size and time limits), take its `redirect_uris`, cache it within limits, and advertise support in the metadata. Dynamic registration stays.

  - id: shared-test-cases
    status: later
    when: Later
    icon: test-tube
    title: Shared test cases
    summary: One language-neutral set of flows, run against both packages, so that they can't drift apart unnoticed.
    links:
      - {label: "#7", url: "https://github.com/Marceltov/mcp-login-oauth/issues/7"}
      - {label: "V3", url: "https://marceltov.github.io/mcp-login-oauth/values/#v3-the-same-in-python-and-typescript"}
    details: |
      Start with what matters most: a code spent once also after a restart, refresh rotation, revocation by a public client, resource binding, and the login link's 5 failures and 10 minutes.

  # ---- done, newest first ----------------------------------------------------------------------------------------------
  - id: docs-site
    status: done
    date: 2026-10-30
    icon: book-open-variant
    title: Documentation site
    summary: Getting started and reference for both packages, one page for their shared behaviour, diagrams, and a design of its own.
    links:
      - {label: "PR #8", url: "https://github.com/Marceltov/mcp-login-oauth/pull/8"}

  - id: better-auth-decision
    status: done
    date: 2026-10-30
    icon: source-branch
    title: Apps with a web UI use Better Auth
    summary: This library stays the OAuth server for form-login MCP servers; values and roadmap written down.
    links:
      - {label: "ADR 0004", url: "https://marceltov.github.io/mcp-login-oauth/adr/0004-web-apps-sign-in-with-better-auth/"}
      - {label: "PR #4", url: "https://github.com/Marceltov/mcp-login-oauth/pull/4"}

  - id: typescript-package
    status: done
    date: 2026-10-30
    icon: language-typescript
    title: TypeScript package
    summary: The same OAuth server for Node.js, framework-neutral, with a form or one OIDC provider and an encrypted SQLite store.
    links:
      - {label: "ADR 0003", url: "https://marceltov.github.io/mcp-login-oauth/adr/0003-typescript-package/"}
      - {label: "PR #3", url: "https://github.com/Marceltov/mcp-login-oauth/pull/3"}

  - id: server-gaps
    status: done
    date: 2026-10-25
    icon: shield-check-outline
    title: v0.2.0, the gaps the servers needed
    summary: "`check_login` learns the client, tokens bound to a resource, and the issuer on the code redirect."
    links:
      - {label: "ADR 0002", url: "https://marceltov.github.io/mcp-login-oauth/adr/0002-check-login-learns-the-client/"}
      - {label: "PR #2", url: "https://github.com/Marceltov/mcp-login-oauth/pull/2"}

  - id: first-release
    status: done
    date: 2026-10-25
    icon: key-variant
    title: v0.1.0, one library for four servers
    summary: The login OAuth of four FastMCP servers in one library, with an encrypted store and revocation for public clients.
    links:
      - {label: "ADR 0001", url: "https://marceltov.github.io/mcp-login-oauth/adr/0001-shared-login-oauth-library/"}
