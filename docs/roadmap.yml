# The roadmap, as data. docs_hooks/roadmap.py (from passageway) renders it as the timeline on the roadmap page.
#
# Open entries (status next, later or decide) are shown first, in the order of this file, each with a `when` label and `details`.
# Done entries are shown below them, newest date first (the order of this file breaks ties), each with a `date` and a link to its
# pull request or release.
#
# To finish a step: set `status: done`, replace `when` with `date: YYYY-MM-DD`, add the link to its pull request, and move it to the
# top of the done entries. `icon` is the name of a Material Design icon (https://pictogrammers.com/library/mdi/).
# `details` is a small subset of markdown: paragraphs, "- " lists, **bold**, `code` and [links](https://...).

items:
  # ---- open ------------------------------------------------------------------------------------------------------------
  - id: client-id-metadata
    status: next
    when: Next
    icon: card-account-details-outline
    title: Client ID Metadata Documents
    summary: Accept clients that identify themselves by a metadata URL, which the MCP spec now prefers over dynamic registration.
    links:
      - {label: "#6", url: "https://github.com/Marceltov/mcp-login-oauth/issues/6"}
      - {label: "V3", url: "https://mcp-login-oauth.marceltov.de/values/#v3-standards-any-client-speaks"}
    details: |
      Fetch and validate the document (HTTPS only, size and time limits), take its `redirect_uris`, cache it within limits, and advertise support in the metadata. Dynamic registration stays.

  # ---- done, newest first ----------------------------------------------------------------------------------------------
  - id: pypi
    status: done
    date: 2026-10-30
    icon: package-variant-closed
    title: On PyPI
    summary: "`uv add mcp-login-oauth`: v0.2.1 is published from its tag through PyPI Trusted Publishing, with no API token."
    links:
      - {label: "PyPI", url: "https://pypi.org/project/mcp-login-oauth/"}
      - {label: "v0.2.1", url: "https://github.com/Marceltov/mcp-login-oauth/releases/tag/v0.2.1"}
      - {label: "#11", url: "https://github.com/Marceltov/mcp-login-oauth/issues/11"}

  - id: python-only
    status: done
    date: 2026-10-30
    icon: language-python
    title: Python only
    summary: The TypeScript package is gone; TypeScript apps sign in with Better Auth, and a guide says how.
    links:
      - {label: "Guide", url: "https://mcp-login-oauth.marceltov.de/typescript/"}
      - {label: "PR #9", url: "https://github.com/Marceltov/mcp-login-oauth/pull/9"}

  - id: docs-site
    status: done
    date: 2026-10-30
    icon: book-open-variant
    title: Documentation site
    summary: Getting started, reference, behaviour, values and this roadmap, with diagrams and a design of its own.
    links:
      - {label: "PR #8", url: "https://github.com/Marceltov/mcp-login-oauth/pull/8"}

  - id: server-gaps
    status: done
    date: 2026-10-25
    icon: shield-check-outline
    title: v0.2.0, the gaps the servers needed
    summary: "`check_login` learns the client, tokens bound to a resource, and the issuer on the code redirect."
    links:
      - {label: "ADR 0002", url: "https://mcp-login-oauth.marceltov.de/adr/0002-check-login-learns-the-client/"}
      - {label: "PR #2", url: "https://github.com/Marceltov/mcp-login-oauth/pull/2"}

  - id: first-release
    status: done
    date: 2026-10-25
    icon: key-variant
    title: v0.1.0, one library for four servers
    summary: The login OAuth of four FastMCP servers in one library, with an encrypted store and revocation for public clients.
    links:
      - {label: "ADR 0001", url: "https://mcp-login-oauth.marceltov.de/adr/0001-shared-login-oauth-library/"}
